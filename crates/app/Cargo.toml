[package]
name = "json-viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JSON Viewer ported from Electron + React to Rust + Rune"
default-run = "json-viewer"

[dependencies]
# Pinned dev revision of Rune. Every Rune crate must come from this same git source.
rune = { git = "https://github.com/anomalyco/rune", rev = "194126ab55d8fee0e8750535a08ca9650f5b7b9e", features = ["native-file-dialog"] }
# Components (buttons, text fields, scrolling helpers). Markdown/syntax stay off.
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "194126ab55d8fee0e8750535a08ca9650f5b7b9e", default-features = false }

# Rope-backed editor buffer (rp-editor): O(log n) edits, O(1) snapshots.
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Deterministic fast fingerprint for persist.rs changed-tab detection.
rustc-hash = "2"
directories = "6"
rfd = "0.15"
arboard = "3"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "json_ops"
harness = false

